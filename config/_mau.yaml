# =====================================================================
# FILE MAU - copy sang config/<ten-site>.yaml roi sua.
#
# Neu ben cung cap link dat ten tab theo QUY UOC o ngay duoi day thi moi du
# an moi chi phai sua DUNG 3 DONG (khoi "SUA 3 DONG NAY"). Toan bo phan
# 'tiers' va 'ingest' giu nguyen, khong phai dong vao, khong phai sua Python.
# =====================================================================


# ---------------------------------------------------------------------
# QUY UOC DAT TEN - COPY NGUYEN KHOI NAY GUI CHO BEN CUNG CAP LINK
# ---------------------------------------------------------------------
# 1. TEN TAB (ten trang tinh): bat dau bang chu TANG va so tang. Het.
#
#       TANG 1        TANG 2        TANG 3        TANG 4
#
#    Mot tang co nhieu tab thi viet them gi cung duoc o phia sau - tool khong
#    doc toi phan do, no chi do dung hai chu "TANG <so>" o dau ten:
#
#       TANG 1 - GUEST POST
#       TANG 1 - BAO PR
#       TANG 4 - BLOG COMMENT 2
#
#    - Viet "TIER 1" thay cho "TANG 1" cung duoc.
#    - KHONG danh dau tieng Viet trong ten tab.
#    - Moi ten tab chi duoc nhac DEN MOT tang. Tab tang 3 day link ve tang 2
#      van dat la "TANG 3", TUYET DOI khong viet "TANG 3 day TANG 2" - ten co
#      hai so tang se bi gan nham.
#    - Tab KHONG chua link (huong dan, bang gia, tong hop) dat ten khong co
#      chu TANG. Tool se bo qua va in mot dong canh bao - dung nhu vay.
#
# 2. COT DU LIEU: dong dau tien cua tab la dong tieu de. Ten cot chuan:
#
#       LINK BACKLINK   (bat buoc)  URL cua trang co dat backlink
#       ANCHOR          (tuy chon)  anchor text da dat
#       LINK DICH       (tuy chon)  URL ma backlink tro toi
#       NGAY DANG       (tuy chon)  ngay dat link
#       GHI CHU         (tuy chon)
#
#    - Moi backlink mot DONG. Khong nhet hai link vao hai cot cua cung mot dong.
#    - Chi cot LINK BACKLINK duoc chua URL bai dang. Cac cot kieu "Ten mien" /
#      "Trang chu" neu co thi tool bo qua, khong tinh la backlink.
#    - Hien tool chi doc cot LINK BACKLINK. Ba cot con lai de danh cho ban
#      nang cap sau (so khop anchor, do tuoi tho link) - cu dien san tu bay gio.
#
# 3. CHIA SE: Google Sheet phai o che do "Anyone with the link - Viewer",
#    neu khong Google tra 403 va tool dung ngay o buoc nap du lieu.
# ---------------------------------------------------------------------


# =====================================================================
# SUA 3 DONG NAY - phan con lai cua file giu nguyen
# =====================================================================
site:
  # (1) Ten ngan, dung de dat ten file ket qua. Khong dau, khong khoang trang.
  name: tensite

  # (2) Domain chinh can nhan backlink. Khong can https://, khong can www.
  money_domain: tensite.com

  # De trong = chi can link tro dung domain la duoc tinh la dat.
  # Chi khai khi ke hoach yeu cau tro dung mot so URL cu the: luc do link tro
  # dung domain nhung sai URL se bi gan ma SAI_URL_DICH.
  target_urls: []

  # Domain khac cung thuoc so huu (domain phu, .vn, .net...). Link tro ve day
  # cung duoc tinh la tro ve money site.
  extra_domains: []

source:
  # google_sheet - dan link Google Sheets (nhieu tab, moi tab la mot nhom link)
  # google_doc   - dan link Google Docs (nhom tach theo dong tieu de "Tier N")
  # xlsx / csv   - link tai truc tiep toi file
  # local        - doc file da co san trong may (khai bao o 'file' hoac 'master_csv')
  type: google_sheet

  # (3) Dan link Google Sheet ben cung cap gui. Day la thu duy nhat thay doi
  #     giua cac dot chay cua cung mot du an.
  url: "https://docs.google.com/spreadsheets/d/XXXXXXXXXXXX/edit"
  file: ""

  # Noi ghi du lieu da lam sach - checker doc file nay. {site} tu thay bang
  # site.name o tren, nen khong phai sua tay va hai du an khong ghi de nhau.
  master_csv: data/{site}_master.csv
# =====================================================================


# ---------------------------------------------------------------------
# Kim tu thap. GIU NGUYEN neu ben cung cap dat ten tab dung quy uoc.
#
# Ten tab co ghi thang so tang ("TANG 2", "Tier 2") thi tool lay luon so do,
# khong can 'match'. Khai bao duoi day chi la luoi du phong.
#
# Vi sao khong them "web 2.0", "bookmark", "guest post" vao 'match': khi ten tab
# KHONG co so tang, tool chon tu khoa KHOP DAI NHAT, nen mot tab "Submiss Web
# 2.0" cua tang 3 se bi keo ve tier 2. Giu 'match' chi co token tang thi khong
# bao gio dung do - va khong phai sua config cho tung du an.
#
#   targets: money             - tang nay tro thang ve money site
#   targets: "tier:N"          - tang nay tro ve tap URL cua tier N
#   targets: [money, "tier:2"] - khai NHIEU dich: tro vao bat ky dich nao trong
#                      danh sach deu duoc tinh la con song. Dich DAU TIEN la
#                      dich ky vong; link roi vao dich khac van la "Link con"
#                      nhung mang ma TRO_SAI_TANG de ban biet so do tang tren
#                      giay dang lech so voi thuc te. Cot "Khop tang" trong file
#                      ket qua ghi ro tung link roi vao dau.
#                      Link chi duoc tro LEN tang tren hoac trong CUNG mot tang.
#   priority         - 1 la quan trong nhat. Anh huong toi muc do to mau:
#                      priority 1     -> nang muc nghiem trong len mot bac
#                      priority >= 4  -> ha xuong mot bac (chi theo doi tong quan)
#   js: true/false   - ep bat/tat render JavaScript cho rieng tang nay
#   label            - CHI de in ra man hinh va tieu de bang ket qua. Khong
#                      tham gia nhan dien tab, sua thoai mai, dai ngan tuy y.
#
# Du an it tang hon thi cu de nguyen: tang nao khong co tab tuong ung se ra
# 0 link, khong gay loi. Muon bang ket qua gon thi xoa han muc do di.
# ---------------------------------------------------------------------
tiers:
  1:
    label: "Tang 1 - tro thang money site"
    targets: money
    priority: 2
    match: ["tang 1", "tier 1"]

  2:
    label: "Tang 2 - tro thang money site"
    # Dat priority 1 khi cac tang duoi deu do don vao tap URL nay: mat mot URL
    # tang 2 la mat ca mot nhanh phia duoi.
    targets: money
    priority: 1
    match: ["tang 2", "tier 2"]

  3:
    label: "Tang 3 - tro ve tang 2"
    # Khai them 'money' vi thuc te rat nhieu link tang duoi tro thang money site.
    # Khai mot dich duy nhat se khien chung bi bao la MAT LINK oan.
    targets: ["tier:2", money]
    priority: 4
    match: ["tang 3", "tier 3"]

  4:
    label: "Tang 4 - tro ve tang 3"
    targets: ["tier:3", "tier:2", money]
    priority: 4
    match: ["tang 4", "tier 4"]

# --- vi du them: mo hinh 2 tang phang, khong co tang 3/4 --------------
#  tiers:
#    1: { label: "Bao chi", targets: money, priority: 1, match: ["tang 1", "tier 1"] }
#    2: { label: "Ve tinh", targets: money, priority: 2, match: ["tang 2", "tier 2"] }

# --- vi du them: tang 3 day thang len tang 1 --------------------------
#    3: { label: "Day tang 1", targets: ["tier:1", money], priority: 3, match: ["tang 3", "tier 3"] }

network:
  concurrency: 8           # so request song song
  per_domain_delay: 1.5    # giay nghi giua 2 request cung domain. KHONG ha duoi 1.0
  timeout: 25
  # So lan thu LAI khi loi ket noi (ConnectError, SSL...) - loai loi that bai
  # trong duoi mot giay nen thu lai gan nhu mien phi.
  # Rieng TIMEOUT khong bao gio thu lai: mot lan da tra tron 'timeout' giay o
  # tren, va link do van con mot luot nua - no duoc day sang Chromium o luot 2.
  retries: 1
  # Router/nha mang tra ve 127.0.0.1 cho ten mien bi chan -> tool tu hoi lai
  # dia chi that qua DNS-over-HTTPS. De true tru khi may nam trong mang noi bo
  # dung split-DNS hop le.
  dns_fallback: true
  verify_ssl: false
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"

js:
  # Tool doc trang theo HAI LUOT:
  #   luot 1 - tai HTML tho cho toan bo danh sach, rat nhanh
  #   luot 2 - chi mo Chromium cho nhung link luot 1 chua doc duoc noi dung that
  #            (khong thay the <a>, bi 403/429, may chu tu choi ket noi...)
  escalate: true

  # De trong la tot nhat - tool tu quyet dinh. Chi dien khi muon ep mot tang
  # LUON render, vi du auto_tiers: [2]
  auto_tiers: []

  # Domain chac chan can trinh duyet - them vao day thi khong phai cho luot 2.
  # Dau cham o dau (".mn.co") khop moi ten mien con.
  force_domains: []

  # domcontentloaded, KHONG phai networkidle: trang co polling khong bao gio
  # "idle" nen networkidle luon timeout va lam hong ca buoc render.
  wait_until: domcontentloaded
  wait_after: 6000         # cho them bao nhieu mili giay cho JS ve xong noi dung
  timeout: 60000

  # So tab Chromium chay song song o luot 2. Day la khau cham nhat ca dot chay.
  #   auto  - tu do theo may: min(4, so CPU // 2). May 2 nhan ra 1 tab (dung
  #           bang hanh vi tuan tu cu), may 12 nhan ra 4 tab.
  #   1..6  - tu dien. Tren 6 bi ha xuong 6 kem canh bao: moi tab ton khoang
  #           300MB RAM, ma khong nhanh them bao nhieu vi luot render van bi
  #           per_domain_delay ham lai.
  # De 'auto' neu tool duoc dung chung tren nhieu may cau hinh khac nhau.
  # Cach kiem chung sau khi nang so tab: loc cot diag_code trong file ket qua,
  # HTTP_429 phai van bang 0. Con 429 nghia la dang ban qua nhanh -> ha xuong.
  concurrency: auto

ingest:
  # Tab khong chua link. CHU Y: so khop theo CHUOI CON va KHONG bo dau tieng
  # Viet - dung them tu ngan hoac tu co the xuat hien trong ten tab that
  # (them "tong hop" se lam bay luon tab "TANG 2 - TONG HOP WEB 2.0").
  # Ten tab dung quy uoc thi thuong khong can khai gi o day: tab khong co chu
  # TANG da tu dong bi bo qua, chi khac la co them mot dong canh bao.
  drop_sheets: ["sheet1", "huong dan", "template"]
  drop_domains: []

  # Quy uoc dat cot LINK BACKLINK cho phep co dinh muc nay mot lan cho moi
  # du an: moi tab co chu TANG (hoac TIER) trong ten deu chi lay o o cot
  # "LINK BACKLINK", bo qua cac cot URL phu nhu "Ten mien" / "Trang chu".
  # Khoa  = tu khoa trong TEN TAB
  # Gia tri = ten cot o dong tieu de (tim trong 10 dong dau cua tab)
  # So khop khong phan biet hoa thuong, khong phan biet dau tieng Viet.
  # Khong tim thay tieu de nao khop thi tool in canh bao roi quay ve quet
  # toan bo o - nen file cu khong dung quy uoc van chay duoc.
  sheet_columns:
    "tang": ["link backlink"]
    "tier": ["link backlink"]
  # Tab dac biet co ten cot khac thi them mot dong rieng, khoa dai hon se
  # thang khoa "tang" o tren:
  #  "tang 3 - bookmark": ["url dat link"]

  # In canh bao khi gap URL chi co ten mien, khong co duong dan - dau hieu
  # dang lay nham cot ten mien thay vi cot link.
  warn_homepage_urls: true

  dedupe: true
  strip_tracking: true
  min_url_length: 12

thresholds:
  outbound_link_limit: 150

output:
  dir: results
  formats: [csv, xlsx]
  filename: "{date}_{site}_tier{tier}"

# ---------------------------------------------------------------------
# Doc robots.txt de biet Googlebot co duoc phep vao tung URL khong.
# Trang mo duoc ma bi robots.txt cam thi Google khong ghe vao -> backlink
# khong truyen gia tri -> ma ROBOTS_CHAN_GOOGLE, tinh vao khoan doi bu.
# Moi host chi tai robots.txt mot lan, nen chi phi rat nho.
# ---------------------------------------------------------------------
robots:
  check: true      # false = bo qua buoc nay
  timeout: 10

# ---------------------------------------------------------------------
# Tai lai moi URL voi tu cach Googlebot. Tool KET LUAN THEO GOOGLEBOT, vi
# Google chi truyen gia tri qua nhung gi no nhin thay:
#   nguoi xem thay link, Google bi bao 404       -> Link mat (GOOGLE_BI_BAO_404)
#   nguoi xem thay link, Google khong thay link  -> Link mat (AN_LINK_VOI_GOOGLE)
#   Google thay link, nguoi dung bi chuyen di    -> Link con, ghi chu cloaking
# Googlebot bi chan 403/429/captcha thi KHONG ket luan tu do: nhieu site chi
# chan Googlebot gia (IP may chay tool khong phai cua Google).
# Ton them 1 request moi URL, van xep hang theo per_domain_delay -> luot doc
# HTML cham gan gap doi. Luot render Chromium khong doi.
# ---------------------------------------------------------------------
googlebot:
  check: true
